    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Photo Album</title>
    
    <!-- SDK Dependencies -->
    <script src="apiGateway-js-sdk/lib/axios/dist/axios.standalone.js"></script>
    <script src="apiGateway-js-sdk/lib/url-template/url-template.js"></script>
    <script src="apiGateway-js-sdk/lib/apiGatewayCore/sigV4Client.js"></script>
    <script src="apiGateway-js-sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
    <script src="apiGateway-js-sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
    <script src="apiGateway-js-sdk/lib/apiGatewayCore/utils.js"></script>
    <script src="apiGateway-js-sdk/apigClient.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .upload-section, .search-section {
            flex: 1;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .upload-container {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .custom-labels {
            margin: 20px 0;
        }
        .image-preview {
            max-width: 300px;
            margin: 20px auto;
        }
        #uploadStatus, #searchStatus {
            margin: 10px 0;
            padding: 10px;
        }
        .success { color: green; }
        .error { color: red; }
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .search-result-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
        input[type="text"], input[type="file"], button {
            padding: 8px;
            margin: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Smart Photo Album</h1>
    
    <div class="container">
        <div class="upload-section">
            <h2>Upload Photos</h2>
            <div class="upload-container">
                <input type="file" id="photoInput" accept="image/*">
                <div class="custom-labels">
                    <input type="text" id="customLabels" placeholder="Custom labels (comma-separated)">
                </div>
                <button onclick="uploadPhoto()">Upload Photo</button>
            </div>
            <div id="uploadStatus"></div>
            <div id="imagePreview" class="image-preview"></div>
        </div>

        <div class="search-section">
            <h2>Search Photos</h2>
            <div>
                <input type="text" id="searchQuery" placeholder="Search photos...">
                <button onclick="searchPhotos()">Search</button>
            </div>
            <div id="searchStatus"></div>
            <div id="searchResults" class="search-results"></div>
        </div>
    </div>

    <script>
        // Initialize the API Gateway client with API Key
        var apigClient = apigClientFactory.newClient({
            apiKey: 'wELZmqeQNW4ywORL6C0TwaCGRnUhRxK6P3FXaNt7'
        });

        async function uploadPhoto() {
            const fileInput = document.getElementById('photoInput');
            const customLabelsInput = document.getElementById('customLabels');
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!fileInput.files || !fileInput.files[0]) {
                statusDiv.innerHTML = '<p class="error">Please select a file first</p>';
                return;
            }

            const file = fileInput.files[0];
            const customLabels = customLabelsInput.value.trim();

            try {
                const fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsArrayBuffer(file);
                });

                const timestamp = new Date().getTime();
                const fileName = `${timestamp}-${file.name}`;

                const baseUrl = 'https://fs2ky5jze9.execute-api.us-east-1.amazonaws.com/prod';
                const uploadUrl = `${baseUrl}/photos/${fileName}`;

                const response = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': file.type || 'image/jpeg',
                        'x-amz-meta-customLabels': customLabels,
                        'x-api-key': 'wELZmqeQNW4ywORL6C0TwaCGRnUhRxK6P3FXaNt7'
                    },
                    body: fileData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                statusDiv.innerHTML = '<p class="success">Upload successful!</p>';
                
                const imagePreview = document.getElementById('imagePreview');
                const objectUrl = URL.createObjectURL(file);
                imagePreview.innerHTML = `<img src="${objectUrl}" alt="Uploaded preview" style="max-width: 100%;">`;
                
            } catch (error) {
                console.error('Upload error:', error);
                statusDiv.innerHTML = `<p class="error">Upload failed: ${error.message}</p>`;
            }
        }

        async function searchPhotos() {
            const searchInput = document.getElementById('searchQuery');
            const statusDiv = document.getElementById('searchStatus');
            const resultsDiv = document.getElementById('searchResults');
            
            const query = searchInput.value.trim();
            if (!query) {
                statusDiv.innerHTML = '<p class="error">Please enter a search query</p>';
                return;
            }

            try {
                const params = { q: query };
                const response = await apigClient.searchGet(params, {});
                console.log('Search response:', response);

                if (response.data && response.data.message === "success") {
                    const images = response.data.image_urls;

                    if (images.length === 0) {
                        statusDiv.innerHTML = '<p>No images found</p>';
                        resultsDiv.innerHTML = '';
                        return;
                    }

                    resultsDiv.innerHTML = images.map(url => `
                        <div class="search-result">
                            <img class="search-result-image" src="${url}" alt="Search result">
                        </div>
                    `).join('');

                    statusDiv.innerHTML = `<p class="success">Found ${images.length} results</p>`;
                    searchInput.value = '';  // Clear search box
                } else {
                    statusDiv.innerHTML = '<p class="error">Invalid response format from server</p>';
                    resultsDiv.innerHTML = '';
                    console.error('Unexpected response:', response.data);
                }
                
            } catch (error) {
                console.error('Search error:', error);
                statusDiv.innerHTML = `<p class="error">Search failed: ${error.message}</p>`;
                resultsDiv.innerHTML = '';
            }
        }

        // Enter key triggers search
        document.getElementById('searchQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchPhotos();
            }
        });
    </script>
</body>
</html>
